name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack zip if pom.xml is missing
        run: |
          if [ -z "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)" ]; then
            ZIP=$(find . -iname '*.zip' -not -path './.git/*' | while IFS= read -r z; do
              n=$(printf '%s' "$z" | grep -oE '\([0-9]+\)' | tail -n1 | tr -dc '0-9')
              echo "${n:-0}|$z"
            done | sort -t'|' -k1,1n | tail -n1 | cut -d'|' -f2-)
            if [ -n "$ZIP" ]; then
              echo "Распаковываю: $ZIP"
              mkdir -p unpacked
              unzip -o -q "$ZIP" -d unpacked
            fi
          fi

      - name: Find pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml не найден ни в репозитории, ни в zip."
            exit 1
          fi
          echo "path=$POM" >> "$GITHUB_OUTPUT"

      - name: Fix isReplaceable (Spigot API)
        run: |
          find . -name PbCommand.java -not -path '*/target/*' -exec sed -i 's/b\.isReplaceable()/b.isPassable()/g' {} +

      - name: Build
        run: |
          set -o pipefail
          mvn -B -e -f "${{ steps.pom.outputs.path }}" -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true package 2>&1 | tee build.log

      - name: Report errors and warnings
        if: always()
        run: |
          [ -f build.log ] || exit 0
          grep -E '^\[ERROR\] .*\.java:\[[0-9]+,[0-9]+\]' build.log | sort -u > errors.txt || true
          grep -E '^\[WARNING\] .*\.java' build.log | sort -u > warnings.txt || true
          grep -E '^\[ERROR\]' build.log | grep -vE '\.java:\[' | head -n 40 > other.txt || true
          {
            echo "## Результат сборки"
            echo
            echo "### Ошибки компиляции: $(wc -l < errors.txt)"
            if [ -s errors.txt ]; then echo '```'; cat errors.txt; echo '```'; fi
            echo
            echo "### Прочие ошибки Maven: $(wc -l < other.txt)"
            if [ -s other.txt ]; then echo '```'; cat other.txt; echo '```'; fi
            echo
            echo "### Предупреждения: $(wc -l < warnings.txt)"
            if [ -s warnings.txt ]; then echo '```'; head -n 60 warnings.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            file=$(printf '%s' "$line" | sed -E 's/^\[ERROR\] ([^[:space:]]+\.java):\[([0-9]+),([0-9]+)\] ?(.*)$/\1/')
            ln=$(printf '%s' "$line" | sed -E 's/^\[ERROR\] ([^[:space:]]+\.java):\[([0-9]+),([0-9]+)\] ?(.*)$/\2/')
            col=$(printf '%s' "$line" | sed -E 's/^\[ERROR\] ([^[:space:]]+\.java):\[([0-9]+),([0-9]+)\] ?(.*)$/\3/')
            msg=$(printf '%s' "$line" | sed -E 's/^\[ERROR\] ([^[:space:]]+\.java):\[([0-9]+),([0-9]+)\] ?(.*)$/\4/')
            rel="${file#$GITHUB_WORKSPACE/}"
            echo "::error file=$rel,line=$ln,col=$col::$msg"
          done < errors.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            errors.txt
            warnings.txt
          if-no-files-found: ignore

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrivateBlocks
          path: '**/target/PrivateBlocks-*.jar'
